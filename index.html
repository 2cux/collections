<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <meta
      name="description"
      content="曹波的个人网站：软件工程与 AI 探索。"
    />
    <title>曹波 — 软件工程与 AI</title>
    <style>
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #11110f;
      }

      #home {
        opacity: 0;
      }

      #intro {
        position: fixed;
        z-index: 10;
        inset: 0;
        background: #11110f;
      }
    </style>
  </head>
  <body>
    <main id="home" class="home-shell" inert>
      <nav class="site-nav" aria-label="主导航">
        <a class="brand" href="#top" data-home-focus>曹波<span aria-hidden="true">/</span>CAO BO</a>
        <div class="nav-links">
          <a href="#about">关于</a>
          <a href="#notes">笔记</a>
          <a href="#contact">联系</a>
        </div>
      </nav>

      <section id="top" class="hero-section" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">PERSONAL WEBSITE · 2026</p>
          <h1 id="hero-title">把复杂的事，<br /><em>做得清楚。</em></h1>
          <p class="hero-description">
            软件工程与 AI 的学习者，正在把问题拆开、验证，再重新组合。
          </p>
          <a class="text-link" href="#about" data-home-focus>
            了解更多 <span aria-hidden="true">↗</span>
          </a>
        </div>

        <div class="hero-index" aria-label="当前索引">
          <span class="index-label">FOCUS</span>
          <span class="index-number">01</span>
          <span class="index-rule" aria-hidden="true"></span>
          <span class="index-label">BUILD / LEARN / SHARE</span>
        </div>
      </section>

      <section id="about" class="home-rail" aria-label="近期方向">
        <span>01 / 当前方向</span>
        <span>AI 系统 · 可靠产品 · 持续学习</span>
      </section>

      <section id="notes" class="home-rail" aria-label="笔记">
        <span>02 / 笔记</span>
        <span>把过程留下来，让下一次更快</span>
      </section>

      <section id="contact" class="home-rail" aria-label="联系">
        <span>03 / 联系</span>
        <span>保持开放，欢迎交流</span>
      </section>
    </main>

    <section
      id="intro"
      class="intro-overlay"
      aria-labelledby="intro-title"
      aria-describedby="intro-subtitle"
    >
      <div class="intro-stage">
        <div class="intro-composition" data-intro-composition>
          <div class="intro-graphic-position" aria-hidden="true">
            <svg class="intro-graphic" viewBox="0 0 240 100" role="presentation">
              <defs>
                <clipPath id="intro-graphic-clip">
                  <rect class="intro-graphic-clip" x="70" y="0" width="100" height="100" rx="50" ry="50"></rect>
                </clipPath>
              </defs>
              <rect class="intro-graphic-solid" x="0" y="0" width="240" height="100" fill="#2d8cff" clip-path="url(#intro-graphic-clip)"></rect>
              <g class="intro-graphic-colorway" clip-path="url(#intro-graphic-clip)">
                <rect x="0" y="0" width="240" height="100" fill="#2d8cff"></rect>
                <path d="M0 0H104V100H0Z" fill="#7654e8"></path>
                <path d="M18 87 Q75 18 136 84" fill="none" stroke="#17224b" stroke-width="16" stroke-linecap="round"></path>
                <circle cx="161" cy="33" r="21" fill="#62d36f"></circle>
                <path d="M177 -10L240 16V100H193L164 48Z" fill="#ff6b4a"></path>
              </g>
            </svg>
          </div>
          <div class="intro-frame">
            <div class="intro-hero-text" id="intro-title">
              <span class="intro-line-mask intro-hello-mask">
                <span class="intro-line intro-hello" data-intro-copy="greeting"></span>
              </span>
              <span class="intro-line-mask intro-name-mask">
                <span class="intro-line intro-name" data-intro-copy="name"></span>
              </span>
            </div>

            <div class="intro-welcome">
              <div class="intro-orb-target" aria-hidden="true">
                <canvas id="intro-canvas" class="intro-canvas"></canvas>
                <div class="intro-fallback-orb"><span class="fallback-eye fallback-eye-left"></span><span class="fallback-eye fallback-eye-right"></span><span class="fallback-mouth"></span></div>
              </div>
            <div class="intro-final-copy" id="intro-subtitle">
              <p class="intro-final-description" data-intro-copy="finalDescription"></p>
            </div>

            <button id="enter-site" class="intro-cta" type="button" aria-label="进入网站" aria-hidden="true" disabled>
              <span data-intro-copy="action"></span>
            </button>
            </div>
          </div>
        </div>
        <button id="skip-intro" class="intro-skip" type="button">skip intro</button>
      </div>
    </section>

    <noscript>
      <style>
        #intro { display: none; }
        #home { opacity: 1; transform: none; }
      </style>
      <p class="no-script-message">请启用 JavaScript 以进入网站。</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
